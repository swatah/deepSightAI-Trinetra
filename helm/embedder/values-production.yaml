replicaCount: 10

image:
  repository: deepSightAI-Trinetra/embedder
  tag: v3.0.0
  pullPolicy: IfNotPresent

config:
  LOG_LEVEL: INFO
  REDIS_URL: redis://redis:6379
  MINIO_URL: http://minio:9000
  MILVUS_HOST: milvus
  MILVUS_PORT: "19530"

resources:
  requests:
    memory: "4Gi"
    cpu: "2000m"
    nvidia.com/gpu: "1"
  limits:
    memory: "8Gi"
    cpu: "4000m"
    nvidia.com/gpu: "1"

service:
  type: ClusterIP
  port: 8001
  targetPort: 8001

autoscaling:
  enabled: true
  minReplicas: 10
  # Production scale: Sized for up to 10,000 active cameras (~10,000 fps with frame sampling)
  # Each GPU worker processes ~40-50 fps batch throughput; 250 replicas provide full 10,000 fps peak capacity
  maxReplicas: 250
  # Scale when queue backlog exceeds 50 frames per replica
  targetQueueBacklog: 50
  # Scale when GPU utilization exceeds 80%
  targetGPUUtilizationPercentage: 80
  # Fallback CPU utilization
  targetCPUUtilizationPercentage: 80
