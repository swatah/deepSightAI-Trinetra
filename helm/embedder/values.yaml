replicaCount: 2

image:
  repository: deepSightAI-Trinetra/embedder
  tag: latest
  pullPolicy: IfNotPresent

config:
  LOG_LEVEL: INFO
  REDIS_URL: redis://redis:6379
  MINIO_URL: http://minio:9000
  MILVUS_HOST: milvus
  MILVUS_PORT: "19530"

resources:
  requests:
    memory: "4Gi"
    cpu: "2000m"
    nvidia.com/gpu: "1"
  limits:
    memory: "8Gi"
    cpu: "4000m"
    nvidia.com/gpu: "1"

service:
  type: ClusterIP
  port: 8001
  targetPort: 8001

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

