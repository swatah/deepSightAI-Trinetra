replicaCount: 10

image:
  repository: deepSightAI-Trinetra/extractor
  tag: v3.0.0
  pullPolicy: IfNotPresent

config:
  LOG_LEVEL: INFO
  REDIS_URL: redis://redis:6379
  REGISTRY_URL: http://registry:8000
  MINIO_URL: http://minio:9000

resources:
  requests:
    memory: "1Gi"
    cpu: "1000m"
  limits:
    memory: "2Gi"
    cpu: "2000m"

autoscaling:
  enabled: true
  minReplicas: 10
  # Production scale: 10,000 active RTSP streams / 7 streams per pod = ~1,428 pods ceiling
  maxReplicas: 1500
  targetActiveStreams: 7

service:
  type: ClusterIP
  port: 8001
  targetPort: 8001
