replicaCount: 2

image:
  repository: deepSightAI-Trinetra/extractor
  tag: latest
  pullPolicy: IfNotPresent

config:
  LOG_LEVEL: INFO
  REDIS_URL: redis://redis:6379
  REGISTRY_URL: http://registry:8000
  MINIO_URL: http://minio:9000

resources:
  requests:
    memory: "512Mi"
    cpu: "500m"
  limits:
    memory: "1Gi"
    cpu: "1000m"

autoscaling:
  enabled: true
  minReplicas: 2
  # Dev/staging default ceiling (10 pods * 8 max capacity = 80 streams).
  # For production 10,000 active RTSP streams target (Issues #71, #72, Moderate 9):
  # Set maxReplicas: 1250-1500 with targetActiveStreams: 7-8 per pod (using HW-decode GPU/VAAPI nodes).
  maxReplicas: 10
  targetActiveStreams: 5

service:
  type: ClusterIP
  port: 8001
  targetPort: 8001
