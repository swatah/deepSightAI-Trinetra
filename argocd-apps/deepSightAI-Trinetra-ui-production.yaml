---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: deepSightAI-Trinetra-ui-production
  namespace: argocd
  labels:
    app.kubernetes.io/name: deepSightAI-Trinetra-ui-production
    app.kubernetes.io/part-of: deepSightAI-Trinetra
    app.kubernetes.io/component: ui
spec:
  project: production
  source:
    repoURL: https://github.com/swatah/deepSightAI-Trinetra.git
    targetRevision: main
    path: k8s/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: trinetra
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
    timeout: 15m
