version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-deepSightAI-Trinetra}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9090:9090"
    command: minio server /data --console-address ":9090"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    command: etcd -advertise-client-urls=http://0.0.0.0:2379 -listen-client-urls http://0.0.0.0:2379
    ports:
      - "2379:2379"
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  milvus:
    image: milvusdb/milvus:v2.4.4
    ports:
      - "19530:19530"
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

  registry:
    build:
      context: .
      dockerfile: deepSightAI/Trinetra/ServerAndExtractor/Dockerfile
    command: ["uvicorn", "deepSightAI.Trinetra.ServerAndExtractor.registry:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  main-api:
    build:
      context: .
      dockerfile: deepSightAI/Trinetra/ServerAndExtractor/Dockerfile
    command: ["uvicorn", "deepSightAI.Trinetra.ServerAndExtractor.main_api:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8080:8080"
    environment:
      REDIS_URL: redis://redis:6379
      REGISTRY_URL: http://registry:8000
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-deepSightAI-Trinetra}
    depends_on:
      registry:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  extractor:
    build:
      context: .
      dockerfile: deepSightAI/Trinetra/ServerAndExtractor/Dockerfile
    command: ["uvicorn", "deepSightAI.Trinetra.ServerAndExtractor.extractor:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      REGISTRY_URL: http://registry:8000
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      EXTRACTOR_ID: ${HOSTNAME:-extractor-1}
      EXTRACTOR_URL: http://extractor:8001
    depends_on:
      registry:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  embedder:
    build:
      context: .
      dockerfile: deepSightAI/Trinetra/Embedder/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
    depends_on:
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy

  vision-processing:
    build:
      context: .
      dockerfile: deepSightAI/Trinetra/VisionProcessingService/Dockerfile
    ports:
      - "8082:8082"
    environment:
      REDIS_URL: redis://redis:6379
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-deepSightAI-Trinetra}
    depends_on:
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  watchlist-matcher:
    build:
      context: .
      dockerfile: deepSightAI/Trinetra/WatchlistMatcherService/Dockerfile
    ports:
      - "8083:8083"
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-deepSightAI-Trinetra}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  search-service:
    build:
      context: .
      dockerfile: deepSightAI/Trinetra/SearchService/Dockerfile
    ports:
      - "8081:8081"
    environment:
      REDIS_URL: redis://redis:6379
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-deepSightAI-Trinetra}
    depends_on:
      milvus:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-service:
    build:
      context: .
      dockerfile: deepSightAI/Trinetra/AuthService/Dockerfile
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-deepSightAI-Trinetra}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  ui:
    build:
      context: .
      dockerfile: deepSightAI/Trinetra/UI/Dockerfile
    ports:
      - "8501:8501"
    environment:
      SEARCH_SERVICE_URL: http://search-service:8081
      AUTH_SERVICE_URL: http://auth-service:8002
      WATCHLIST_SERVICE_URL: http://watchlist-matcher:8083
    depends_on:
      - search-service
      - watchlist-matcher

volumes:
  postgres_data:
  minio_data:
