apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base/ui
- ingress.yaml

# Production patches: keep HPA active and production-ready resource limits
patchesStrategicMerge:
- replicas-patch.yaml
- resources-patch.yaml

# Production ConfigMap overrides
configMapGenerator:
- name: trinetra-ui-config
  behavior: merge
  literals:
  - LOG_LEVEL=warning
  - NODE_ENV=production
  - NEXTAUTH_URL=https://trinetra.swatah.ai

# Production secrets — must be provided via CI/CD env vars
secretGenerator:
- name: trinetra-ui-secrets
  literals:
  - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
  - SENTRY_DSN=${SENTRY_DSN}

options:
  disableNameSuffixHash: true
