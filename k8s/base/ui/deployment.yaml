apiVersion: apps/v1
kind: Deployment
metadata:
  name: trinetra-ui
  labels:
    app.kubernetes.io/name: trinetra-ui
    app.kubernetes.io/instance: deepSightAI-Trinetra
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trinetra-ui
  template:
    metadata:
      labels:
        app: trinetra-ui
        app.kubernetes.io/name: trinetra-ui
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
      - name: trinetra-ui
        image: deepSightAI-Trinetra/trinetra-ui:latest
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: trinetra-ui-config
        - secretRef:
            name: trinetra-ui-secrets
            optional: true
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          readOnlyRootFilesystem: false
          allowPrivilegeEscalation: false
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/ready
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
