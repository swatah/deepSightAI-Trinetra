apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trinetra-ui-network-policy
  labels:
    app.kubernetes.io/name: trinetra-ui
    app.kubernetes.io/component: frontend
spec:
  podSelector:
    matchLabels:
      app: trinetra-ui
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow incoming HTTP traffic ONLY from Kubernetes Ingress Controller namespace/pods on port 3000
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: ingress-nginx
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: controller
    ports:
    - protocol: TCP
      port: 3000
  egress:
  # Allow CoreDNS name resolution (UDP & TCP 53)
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow traffic to internal Trinetra backend microservices
  - ports:
    - protocol: TCP
      port: 8002 # auth-service
    - protocol: TCP
      port: 8081 # search-service
    - protocol: TCP
      port: 8083 # watchlist-matcher
    - protocol: TCP
      port: 8080 # main-api / server-extractor
    - protocol: TCP
      port: 9000 # minio storage
  # Allow external HTTPS for Sentry telemetry and error reporting
  - ports:
    - protocol: TCP
      port: 443
