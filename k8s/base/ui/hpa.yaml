apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: trinetra-ui
  labels:
    app.kubernetes.io/name: trinetra-ui
    app.kubernetes.io/instance: deepSightAI-Trinetra
    app.kubernetes.io/component: frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: trinetra-ui
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
