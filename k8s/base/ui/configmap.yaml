apiVersion: v1
kind: ConfigMap
metadata:
  name: trinetra-ui-config
  labels:
    app.kubernetes.io/name: trinetra-ui
    app.kubernetes.io/instance: deepSightAI-Trinetra
    app.kubernetes.io/component: frontend
data:
  # Backend microservice URLs (used by Next.js reverse-proxy rewrites)
  AUTH_SERVICE_URL: "http://auth-service:8002"
  SEARCH_SERVICE_URL: "http://search-service:8081"
  WATCHLIST_SERVICE_URL: "http://watchlist-matcher:8083"
  SERVER_SERVICE_URL: "http://main-api:8080"
  MINIO_URL: "http://minio:9000"
  # Next.js runtime
  NODE_ENV: "production"
  NEXTAUTH_URL: "http://trinetra-ui:3000"
  LOG_LEVEL: "INFO"
