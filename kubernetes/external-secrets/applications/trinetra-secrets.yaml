  namespace: deepSightAI-Trinetra
  labels:
    app.kubernetes.io/component: auth
    app.kubernetes.io/part-of: deepSightAI-Trinetra
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: trinetra-jwt-credentials
    creationPolicy: Owner
  data:
