      remoteRef:
        key: secret/data/trinetra/auth
        property: jwt-secret-key
    - secretKey: jwt-private-key
      remoteRef:
        key: secret/data/trinetra/auth
        property: jwt-private-key
    - secretKey: jwt-public-key
      remoteRef:
        key: secret/data/trinetra/auth
