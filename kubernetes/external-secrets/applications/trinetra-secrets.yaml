apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: deepSightAI-Trinetra
  labels:
    app.kubernetes.io/name: trinetra
    app.kubernetes.io/part-of: deepSightAI-Trinetra
spec:
  provider:
    vault:
      server: "https://vault.external-secrets.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "trinetra-service"
          serviceAccountRef:
            name: trinetra-service-account
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: trinetra-postgres-secrets
  namespace: deepSightAI-Trinetra
  labels:
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: deepSightAI-Trinetra
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: trinetra-postgres-credentials
    creationPolicy: Owner
  data:
    - secretKey: database-url
      remoteRef:
        key: secret/data/trinetra/postgres
        property: database-url
    - secretKey: postgres-user
      remoteRef:
        key: secret/data/trinetra/postgres
        property: username
    - secretKey: postgres-password
      remoteRef:
        key: secret/data/trinetra/postgres
        property: password
    - secretKey: postgres-db
      remoteRef:
        key: secret/data/trinetra/postgres
        property: database-name
---
